<!doctype html>
<html lang="en" data-base="../">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Submissions · BrandLens</title>
<link rel="icon" href="../assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css"></head>
<body><div id="app"></div>
<script src="../js/checker.js"></script><script src="../js/api.js"></script><script src="../js/app.js"></script>
<script>
(async () => {
  await API.ready;
  const ctx = UI.shell({ role: 'creator', active: 'submissions', title: 'My Submissions' }); if (!ctx) return;
  const el = ctx.content; el.innerHTML = UI.loading();
  const FILTERS = [['all', 'All'], ['draft', 'Drafts'], ['pending_review', 'Under review'], ['changes_requested', 'Changes requested'], ['approved', 'Approved'], ['rejected', 'Rejected']];
  let subs = [], filter = FILTERS.some(f => f[0] === UI.q('status')) ? UI.q('status') : 'all';
  const inGroup = (s, k) => k === 'all' || s.status === k || (k === 'draft' && s.status === 'ai_checked');
  function render() {
    const list = subs.filter(s => inGroup(s, filter));
    el.innerHTML = `<div class="page-head"><div><h1>My submissions</h1><p>Track every post from draft to decision.</p></div><a class="btn btn-primary" href="studio.html">${UI.icon('plus')}Create content</a></div>
      <div class="chips" style="margin-bottom:16px">${FILTERS.map(([k, l]) => `<button class="chip ${k === filter ? 'on' : ''}" data-f="${k}">${l} (${subs.filter(s => inGroup(s, k)).length})</button>`).join('')}</div>
      <section class="card">${list.length ? `<div class="table-wrap"><table><thead><tr><th>Title</th><th>Company</th><th>Status</th><th>Version</th><th>Updated</th><th></th></tr></thead><tbody>
        ${list.map(s => `<tr><td><div class="t-title">${UI.esc(s.title)}</div><div class="sub">${UI.esc(s.channel)}${s.no ? ' · post #' + s.no : ''}</div></td><td>${UI.esc(s.companyName)}</td><td>${UI.badge(s.status)}</td>
          <td>v${s.versions.length}</td><td class="sub">${UI.fmtDate(s.updatedAt)}</td>
          <td><a class="btn btn-sm" href="${['draft', 'ai_checked', 'changes_requested'].includes(s.status) ? 'studio.html?draft=' + s.id : 'report.html?id=' + s.id}">${['draft', 'ai_checked'].includes(s.status) ? 'Continue' : s.status === 'changes_requested' ? 'Revise' : 'View report'}</a></td></tr>`).join('')}</tbody></table></div>`
        : UI.empty('file-text', subs.length ? 'Nothing in this filter' : 'No submissions yet', subs.length ? 'Try another filter.' : 'Create your first post and check it against a company’s rules.', subs.length ? '' : '<a class="btn btn-primary" href="companies.html">Find a company</a>')}</section>`;
  }
  el.addEventListener('click', e => { const b = e.target.closest('[data-f]'); if (b) { filter = b.dataset.f; history.replaceState(null, '', filter === 'all' ? 'submissions.html' : 'submissions.html?status=' + filter); render(); } });
  try { subs = await API.listSubmissions(); render(); } catch (e) { el.innerHTML = UI.empty('alert', 'Could not load submissions', e.message, '<button class="btn" onclick="location.reload()">Retry</button>'); }
})();
</script></body></html>
