<!doctype html>
<html lang="en" data-base="../">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Brand Guidelines · BrandLens</title>
<link rel="icon" href="../assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css"></head>
<body><div id="app"></div>
<script src="../js/checker.js"></script><script src="../js/api.js"></script><script src="../js/app.js"></script>
<script>
(async () => {
  await API.ready;
  const ctx = UI.shell({ role: 'creator', active: 'companies', title: 'Brand Guidelines' }); if (!ctx) return;
  const el = ctx.content, esc = UI.esc; el.innerHTML = UI.loading();
  async function load() {
    try {
      const c = await API.getCompany(UI.q('id')), g = c.guidelines, can = c.access === 'open' || c.access === 'granted';
      document.title = c.name + ' · BrandLens';
      const btn = can ? `<a class="btn btn-primary" href="studio.html?company=${c.id}">${UI.icon('pencil', 16)}Write content for ${esc(c.name)}</a>`
        : c.access === 'pending' ? '<button class="btn" disabled>Access request pending</button>' : `<button class="btn btn-primary" id="req">Request access</button>`;
      el.innerHTML = `<p style="margin-bottom:10px"><a class="btn btn-ghost btn-sm" href="companies.html">← Find companies</a></p>
        <div class="page-head"><div class="row"><div class="logo-tile" style="width:52px;height:52px;border-radius:12px;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:700;font-size:18px">${esc(UI.initials(c.name))}</div>
          <div><h1>${esc(c.name)}</h1><p>${esc(c.industry)}</p></div></div>${btn}</div>
        <div class="stack" style="max-width:760px">
        <section class="card card-pad"><h2 style="margin-bottom:12px">About</h2><dl class="kv"><dt>Description</dt><dd>${esc(c.description)}</dd>${c.website ? `<dt>Website</dt><dd>${esc(c.website)}</dd>` : ''}
          <dt>Access</dt><dd>${c.accessMode === 'open' ? 'Open to all creators' : 'Approval required'}</dd></dl></section>
        ${can ? `<section class="card card-pad"><h2 style="margin-bottom:12px">Brand voice</h2><dl class="kv"><dt>Tone</dt><dd>${esc(c.voice.tone)}</dd>${c.voice.personality ? `<dt>Personality</dt><dd>${esc(c.voice.personality)}</dd>` : ''}${c.voice.style ? `<dt>Writing style</dt><dd>${esc(c.voice.style)}</dd>` : ''}${c.voice.notes ? `<dt>Notes</dt><dd>${esc(c.voice.notes)}</dd>` : ''}${c.voice.maxExclamations != null ? `<dt>Exclamations</dt><dd>At most ${c.voice.maxExclamations} per post</dd>` : ''}${c.voice.noAllCaps ? '<dt>Capital letters</dt><dd>Avoid ALL CAPS words</dd>' : ''}</dl></section>
        <section class="card card-pad"><h2 style="margin-bottom:12px">What you can and cannot say</h2>
          ${g.terms.length + g.claims.length + g.disclaimers.length ? `<ul class="item-list">
            ${g.terms.map(i => `<li class="item"><div class="grow"><b>Avoid “${esc(i.avoid)}”</b><div class="muted small">Say “${esc(i.use)}” instead</div></div>${UI.sevBadge(i.severity || 'medium')}</li>`).join('')}
            ${g.claims.map(i => `<li class="item"><div class="grow"><b>Do not claim “${esc(i.phrase)}” without proof</b><div class="muted small">${i.safe ? 'Approved wording: ' + esc(i.safe) : 'Needs an approved fact'}</div></div>${UI.sevBadge(i.severity || 'high')}</li>`).join('')}
            ${g.disclaimers.map(i => `<li class="item"><div class="grow"><b>Required disclaimer</b><div>${esc(i.text)}</div><div class="muted small">${i.trigger ? 'When your post mentions: ' + esc(i.trigger) : 'On every post'}</div></div>${UI.sevBadge(i.severity || 'high')}</li>`).join('')}</ul>` : '<p class="muted">This company has not added any rules yet.</p>'}
          <p class="muted small" style="margin-top:12px">Approved company facts stay private. BrandLens uses them to check your post and tells you what needs fixing.</p></section>`
        : `<section class="card">${UI.empty('shield', 'Guidelines unlock with access', c.access === 'pending' ? 'Your request is waiting for the company to approve it.' : 'This company approves creators before sharing its guidelines. Send a request to get access.')}</section>`}
        </div>`;
      const r = document.getElementById('req');
      if (r) r.onclick = async () => { r.disabled = true; try { await API.requestAccess(c.id); UI.toast('Access requested. The company will review it.', 'ok'); load(); } catch (e) { UI.toast(e.message, 'bad'); r.disabled = false; } };
    } catch (e) { el.innerHTML = UI.empty('alert', 'Could not open this company', e.message, '<a class="btn" href="companies.html">Back to companies</a>'); }
  }
  load();
})();
</script></body></html>
