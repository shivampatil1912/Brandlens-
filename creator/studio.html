<!doctype html>
<html lang="en" data-base="../">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Content Studio · BrandLens</title>
<link rel="icon" href="../assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>/* BrandLens Embedded CSS */
/* BrandLens design system — light workspace, navy structure, purple/cyan used sparingly */
:root{
  --bg:#F5F6FA; --surface:#FFFFFF; --line:#E2E5EF; --line-2:#EEF0F6;
  --text:#101437; --muted:#5F6A86; --faint:#8A93AB;
  --navy:#090D20; --navy-2:#141A3D; --navy-3:#262E66;
  --purple:#7447ED; --cyan:#28BCEB; --grad:linear-gradient(90deg,#7447ED 0%,#28BCEB 100%);
  --ok:#14703A; --ok-bg:#DDF5E6; --warn:#8A4B06; --warn-bg:#FDF0CF; --bad:#9F1D1D; --bad-bg:#FDE3E3; --info:#2A3AA8; --info-bg:#E4E8FD;
  --r-s:8px; --r-m:12px; --r-l:18px;
  --font:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:var(--font);font-size:15px;line-height:1.55;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;line-height:1.2;letter-spacing:-.01em}
h1{font-size:26px;font-weight:700} h2{font-size:17px;font-weight:650} h3{font-size:15px;font-weight:650}
p{margin:0} a{color:inherit} img{max-width:100%;display:block}
.muted{color:var(--muted)} .faint{color:var(--faint)} .small{font-size:13px} .center{text-align:center}
.ic{flex:none;vertical-align:-3px}
:focus-visible{outline:2px solid var(--purple);outline-offset:2px;border-radius:4px}

/* ---------- Buttons & fields ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:inherit;font-weight:600;font-size:14px;padding:10px 16px;border-radius:var(--r-s);border:1px solid var(--line);background:var(--surface);color:var(--text);cursor:pointer;text-decoration:none;transition:background .15s,border-color .15s,transform .05s;white-space:nowrap}
.btn:hover{background:#F0F2FA;border-color:#CDD2E4}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.btn-primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn-primary:hover{background:var(--navy-2);border-color:var(--navy-2)}
.btn-accent{background:var(--grad);border:0;color:#101437;padding:11px 18px}
.btn-accent:hover{filter:brightness(1.06);background:var(--grad)}
.btn-danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn-danger:hover{background:#821818;border-color:#821818}
.btn-ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn-ghost:hover{background:#EBEEF8;color:var(--text);border-color:transparent}
.btn-sm{padding:6px 11px;font-size:13px}
.btn-block{width:100%}
.spinner{width:16px;height:16px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .7s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}

.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.field>label,.label{font-weight:600;font-size:13.5px}
.hint{font-size:12.5px;color:var(--muted)}
.input,.textarea,.select{font:inherit;width:100%;padding:10px 12px;border:1px solid #CBD0E2;border-radius:var(--r-s);background:#fff;color:var(--text)}
.textarea{min-height:130px;resize:vertical;line-height:1.55}
.input:focus,.textarea:focus,.select:focus{outline:2px solid rgba(124,92,252,.35);border-color:var(--purple)}
.input.invalid,.textarea.invalid,.select.invalid{border-color:var(--bad)}
.err{color:var(--bad);font-size:12.5px;min-height:0}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.check input{margin-top:4px;accent-color:var(--navy)}
.form-error{background:var(--bad-bg);color:var(--bad);border-radius:var(--r-s);padding:10px 12px;font-size:13.5px;margin-bottom:14px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.grow{flex:1;min-width:0}

/* ---------- Panels ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m)}
.card-pad{padding:20px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line-2)}
.card-body{padding:20px}
.stack>*+*{margin-top:16px}
.grid-2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px;align-items:start}
.grid-eq{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.page-head p{margin-top:4px;color:var(--muted)}

.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:16px 18px}
.stat b{display:block;font-size:30px;line-height:1.1;font-weight:700;letter-spacing:-.02em}
.stat span{color:var(--muted);font-size:13px}
.stat.hot{border-color:#C9BEFF;background:linear-gradient(180deg,#F6F3FF,#fff)}

/* ---------- Badges ---------- */
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;background:#EEF0F6;color:var(--muted);white-space:nowrap}
.b-ok{background:var(--ok-bg);color:var(--ok)} .b-warn{background:var(--warn-bg);color:var(--warn)}
.b-bad{background:var(--bad-bg);color:var(--bad)} .b-info{background:var(--info-bg);color:var(--info)}
.b-muted{background:#EEF0F6;color:var(--muted)}

/* ---------- Tables ---------- */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:600;font-size:12.5px;color:var(--muted);padding:10px 16px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:13px 16px;border-bottom:1px solid var(--line-2);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:#FAFBFE}
td .sub{color:var(--muted);font-size:12.5px}
.t-title{font-weight:600}

/* ---------- Tabs & chips ---------- */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow-x:auto}
.tab{font:inherit;font-weight:600;font-size:14px;color:var(--muted);background:none;border:0;border-bottom:2px solid transparent;padding:10px 14px;cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--text)}
.tab.on{color:var(--text);border-bottom-color:var(--purple)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font:inherit;font-size:13px;font-weight:600;padding:6px 12px;border:1px solid var(--line);background:#fff;border-radius:99px;cursor:pointer;color:var(--muted)}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}

/* ---------- Banners, empty ---------- */
.banner{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:var(--r-m);margin-bottom:18px;font-size:14px;border:1px solid transparent}
.banner.info{background:var(--info-bg);color:#22308F} .banner.warn{background:var(--warn-bg);color:var(--warn)}
.banner.ok{background:var(--ok-bg);color:var(--ok)} .banner.bad{background:var(--bad-bg);color:var(--bad)}
.banner strong{display:block}
.empty{text-align:center;padding:44px 20px;color:var(--muted)}
.empty .ic-wrap{width:48px;height:48px;border-radius:50%;background:#ECEEF8;display:grid;place-items:center;margin:0 auto 12px;color:var(--navy-3)}
.empty h3{color:var(--text);margin-bottom:4px}
.empty .btn{margin-top:14px}
.loading{padding:60px 20px;text-align:center;color:var(--muted)}

/* ---------- List items ---------- */
.item-list{list-style:none;margin:0;padding:0}
.item{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line-2)}
.item:last-child{border-bottom:0}
.item .grow{font-size:14px}
.item .x{background:none;border:0;color:var(--faint);cursor:pointer;padding:4px;border-radius:6px}
.item .x:hover{color:var(--bad);background:var(--bad-bg)}
.arrow{color:var(--faint);padding:0 6px}
.kv{display:grid;grid-template-columns:130px 1fr;gap:6px 14px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0}

/* ---------- App shell ---------- */
.app{display:flex;min-height:100vh}
.sidebar{width:248px;background:var(--navy);color:#C5CBEA;display:flex;flex-direction:column;padding:18px 14px;position:fixed;inset:0 auto 0 0;z-index:30;transition:transform .2s}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:#fff;font-weight:700;font-size:18px;letter-spacing:-.01em;padding:4px 8px 16px}
.brand img{width:34px;height:34px;border-radius:9px}
.ws{margin:0 4px 14px;padding:10px 12px;border-radius:var(--r-s);background:rgba(255,255,255,.07);font-size:13px;line-height:1.35}
.ws b{display:block;color:#fff;font-size:14px;word-break:break-word}
.nav{display:flex;flex-direction:column;gap:2px;flex:1}
.nav a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:var(--r-s);color:#B9C0E4;text-decoration:none;font-weight:500;font-size:14.5px;position:relative}
.nav a:hover{background:rgba(255,255,255,.07);color:#fff}
.nav a.on{background:rgba(255,255,255,.1);color:#fff}
.nav a.on::before{content:"";position:absolute;left:-14px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--grad)}
.side-foot{border-top:1px solid rgba(255,255,255,.1);padding-top:12px}
.side-foot button{width:100%;display:flex;gap:11px;align-items:center;background:none;border:0;color:#B9C0E4;font:inherit;font-size:14.5px;padding:10px 12px;border-radius:var(--r-s);cursor:pointer}
.side-foot button:hover{background:rgba(255,255,255,.07);color:#fff}
.main{flex:1;margin-left:248px;min-width:0;display:flex;flex-direction:column}
.topbar{height:62px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 24px;position:sticky;top:0;z-index:20}
.topbar .t{font-weight:650;font-size:16px}
.burger{display:none}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--navy-3);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px}
.me{display:flex;gap:10px;align-items:center}
.me .who{line-height:1.25;font-size:13px}.me .who b{display:block;font-size:13.5px}
.content{padding:28px 28px 60px;max-width:1240px;width:100%}
.bell{position:relative}
.bell-btn{position:relative;background:none;border:1px solid var(--line);border-radius:var(--r-s);width:38px;height:38px;display:grid;place-items:center;cursor:pointer;color:var(--text)}
.bell-btn:hover{background:#F0F2FA}
.dot{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;border-radius:9px;background:var(--purple);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px}
.bell-panel{position:absolute;right:0;top:46px;width:340px;max-width:90vw;background:#fff;border:1px solid var(--line);border-radius:var(--r-m);box-shadow:0 12px 32px rgba(16,20,55,.14);display:none;overflow:hidden}
.bell-panel.open{display:block}
.bell-panel header{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line-2);font-weight:650}
.bell-panel a.n{display:block;padding:11px 14px;border-bottom:1px solid var(--line-2);text-decoration:none;font-size:13.5px}
.bell-panel a.n:hover{background:#F8F9FD}
.bell-panel a.n.unread{background:#F6F3FF}
.bell-panel a.n small{display:block;color:var(--faint);margin-top:2px}
.bell-list{max-height:380px;overflow-y:auto}
.notif{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line-2);font-size:14px;text-decoration:none;color:inherit}
.notif:last-child{border-bottom:0}
.notif .ico{width:32px;height:32px;border-radius:50%;background:#EEEBFF;color:var(--purple);display:grid;place-items:center;flex:none}
.notif small{display:block;color:var(--faint)}

/* ---------- Toasts & modal ---------- */
.toasts{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:10px;z-index:100}
.toast{background:var(--navy);color:#fff;padding:12px 16px;border-radius:var(--r-s);font-size:14px;max-width:360px;box-shadow:0 8px 24px rgba(16,20,55,.25);animation:pop .18s ease-out}
.toast.bad{background:var(--bad)} .toast.ok{background:#12603A}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.backdrop{position:fixed;inset:0;background:rgba(16,20,55,.5);display:grid;place-items:center;z-index:90;padding:20px}
.modal{background:#fff;border-radius:var(--r-l);width:100%;max-width:440px;padding:24px}
.modal h2{margin-bottom:8px}.modal p{color:var(--muted);margin-bottom:20px}
.modal .row{justify-content:flex-end}

/* ---------- Findings & highlights ---------- */
.draft{white-space:pre-wrap;word-break:break-word;font-size:15.5px;line-height:1.75;max-width:70ch}
mark.hl{background:none;color:inherit;padding:1px 2px;border-radius:3px;cursor:pointer;border-bottom:2px solid}
mark.hl-high{background:#FDE3E3;border-color:#E04444} mark.hl-medium{background:#FDF0CF;border-color:#E39B1B} mark.hl-info{background:#E4E8FD;border-color:#6577E8}mark.hl-critical{background:#FBD0D0;border-color:#B91C1C}
mark.hl.flash{outline:3px solid rgba(124,92,252,.55)}
.finding{border:1px solid var(--line);border-left:4px solid var(--faint);border-radius:var(--r-s);padding:16px;background:#fff}
.finding.sev-high{border-left-color:#E04444}.finding.sev-medium{border-left-color:#E39B1B}.finding.sev-info{border-left-color:#6577E8}.finding.sev-critical{border-left-color:#B91C1C}
.finding.is-dismissed{opacity:.6;background:#FAFBFE}
.finding.flash{box-shadow:0 0 0 3px rgba(124,92,252,.4)}
.finding-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.sev{font-size:12px;font-weight:700}
.sev-high.sev{color:#C02828}.sev-medium.sev{color:#A8650A}.sev-info.sev{color:#3F52C9}.sev-critical.sev{color:#9F1D1D}
.cat{font-size:12.5px;color:var(--muted)}
.excerpt{margin:0 0 8px;padding:8px 12px;background:#F6F7FC;border-radius:6px;font-weight:600;word-break:break-word}
.excerpt.missing{font-weight:500;color:var(--muted);font-style:italic}
.why{margin-bottom:10px}
.finding .meta{display:grid;grid-template-columns:96px 1fr;gap:4px 12px;font-size:13px;margin:0 0 12px}
.finding .meta dt{color:var(--muted)}.finding .meta dd{margin:0}
.suggest{display:flex;gap:10px;background:#F4F1FF;border-radius:var(--r-s);padding:10px 12px;font-size:13.5px;color:#33288A}
.suggest .addition{margin-top:6px;padding:6px 8px;background:#fff;border-radius:6px;color:var(--text)}
.finding-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.timeline{list-style:none;margin:0;padding:0 0 0 14px;border-left:2px solid var(--line)}
.timeline li{position:relative;padding:0 0 14px 16px;font-size:13.5px}
.timeline li::before{content:"";position:absolute;left:-22px;top:5px;width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid var(--purple)}
.timeline small{display:block;color:var(--faint)}
.comment{padding:12px 14px;border-radius:var(--r-s);background:#F6F7FC;font-size:14px}
.comment+.comment{margin-top:10px}
.comment.company{background:#EEEBFF}
.comment b{font-size:13px}.comment small{color:var(--faint);margin-left:6px}
.comment p{margin-top:4px;white-space:pre-wrap}
.company-card{padding:18px;display:flex;flex-direction:column;gap:10px}
.company-card .logo-tile{width:42px;height:42px;border-radius:10px;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:700}
.search{position:relative;max-width:480px;width:100%}
.search .ic{position:absolute;left:12px;top:12px;color:var(--faint)}
.search .input{padding-left:38px}
.hide{display:none!important}

/* ---------- Landing ---------- */
.site-header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.site-header .in{max-width:1180px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;gap:28px}
.site-header .brand{color:var(--navy);padding:0}
.site-nav{display:flex;gap:22px;margin-left:auto;align-items:center}
.site-nav a{text-decoration:none;color:var(--muted);font-weight:500;font-size:14.5px}
.site-nav a:hover{color:var(--text)}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}
.hero{background:#fff;border-bottom:1px solid var(--line)}
.hero .wrap{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:56px;align-items:center;padding-top:72px;padding-bottom:72px}
.hero h1{font-size:clamp(34px,4.6vw,54px);font-weight:750;letter-spacing:-.03em;line-height:1.06}
.hero .lead{margin-top:18px;font-size:18px;color:var(--muted);max-width:52ch}
.portals{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:32px}
.hero-art{background:var(--navy);border-radius:var(--r-l);overflow:hidden;aspect-ratio:1/1;max-width:500px;justify-self:end;width:100%;box-shadow:0 30px 60px -20px rgba(18,22,58,.45)}
.hero-art img{width:100%;height:100%;object-fit:cover}
.section{padding:72px 0}
.section h2{font-size:30px;letter-spacing:-.02em;margin-bottom:10px}
.section .sub{color:var(--muted);max-width:56ch;margin-bottom:34px}
.step{padding:24px;border-right:1px solid var(--line)}
.step:last-child{border-right:0}
.step .n{width:30px;height:30px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px;margin-bottom:14px}
.step h3{margin-bottom:6px}.step p{font-size:14px;color:var(--muted)}
.features{display:grid;grid-template-columns:repeat(3,1fr);gap:28px 36px}
.feature .ico{width:40px;height:40px;border-radius:10px;background:#EEEBFF;color:var(--purple);display:grid;place-items:center;margin-bottom:12px}
.feature p{font-size:14px;color:var(--muted);margin-top:4px}
.about{background:#fff;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.about .wrap{max-width:820px}
.about p{color:var(--muted);font-size:16.5px;margin-bottom:14px}
.footer{padding:30px 0;color:var(--muted);font-size:13.5px}
.footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}

/* ---------- Auth ---------- */
.auth{min-height:100vh;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr)}
.auth-art{background:var(--navy);color:#fff;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:40px;gap:28px;text-align:center}
.auth-art img{width:min(380px,80%);border-radius:var(--r-l)}
.auth-art p{max-width:34ch;color:#C5CBEA;font-size:16px}
.auth-form{display:flex;align-items:center;justify-content:center;padding:40px 24px;background:#fff}
.auth-box{width:100%;max-width:410px}
.auth-box h1{font-size:25px;margin-bottom:6px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:#EEF0F7;border-radius:var(--r-s);padding:4px;margin:20px 0 24px}
.seg button{font:inherit;font-weight:600;font-size:14px;padding:9px;border:0;background:none;border-radius:6px;cursor:pointer;color:var(--muted)}
.seg button.on{background:#fff;color:var(--text);box-shadow:0 1px 3px rgba(16,20,55,.12)}
.switch{margin-top:18px;text-align:center;font-size:14px;color:var(--muted)}
.switch a{color:var(--navy);font-weight:600}
.dev-note{margin-top:20px;font-size:12.5px;background:#FFF8E1;border:1px solid #F5DD8A;border-radius:var(--r-s);padding:10px 12px;color:#6B5200}

/* ---------- Responsive ---------- */
@media (max-width:980px){
  .grid-2{grid-template-columns:1fr}
  .hero .wrap{grid-template-columns:1fr;padding-top:44px;padding-bottom:44px}
  .hero-art{justify-self:start;max-width:380px}
    .features{grid-template-columns:1fr 1fr}
}
@media (max-width:760px){
  .sidebar{transform:translateX(-100%)}
  body.nav-open .sidebar{transform:none;box-shadow:0 0 0 100vmax rgba(16,20,55,.45)}
  .main{margin-left:0}
  .burger{display:grid}
  .content{padding:20px 16px 60px}
  .topbar{padding:0 14px}
  .me .who{display:none}
  .auth{grid-template-columns:1fr}.auth-art{padding:28px 20px;gap:14px}.auth-art img{width:150px}.auth-art p{display:none}
  .portals{grid-template-columns:1fr}
  .site-nav a:not(.btn){display:none}
  .features{grid-template-columns:1fr}.step{border-right:0;border-bottom:1px solid var(--line)}.step:last-child{border-bottom:0}

<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../style.css"></head>
<body><div id="app"></div>
<script src="../js/checker.js"></script><script src="../js/vision.js"></script><script src="../js/trust.js"></script><script src="../js/cloud.js"></script><script src="../js/api.js"></script><script src="../js/i18n.js"></script><script src="../js/app.js"></script>
<script>
(async () => {
  await API.ready;
  const ctx = UI.shell({ role: 'creator', active: 'studio', title: 'Content Studio' }); if (!ctx) return;
  const el = ctx.content, esc = UI.esc; el.innerHTML = UI.loading();
  const CHANNELS = ['Instagram Post', 'LinkedIn Post', 'Advertisement', 'Facebook Post', 'X Post', 'Blog', 'Marketing Email', 'Product Description', 'Other'];
  const EDITABLE = ['draft', 'ai_checked', 'changes_requested'];
  let sub = null, busy = false, savedText = '', saveTimer = null, lastSaved = null, curImage = null, showPreview = false;
  const $ = id => document.getElementById(id);

  try {
    const all = await API.listCompanies('');
    const companies = all.filter(c => c.access === 'open' || c.access === 'granted');
    if (UI.q('draft')) {
      try {
        sub = await API.getSubmission(UI.q('draft'));
        if (!EDITABLE.includes(sub.status)) { location.replace('report.html?id=' + sub.id); return; }
      } catch (err) {
        sub = null;
        history.replaceState(null, '', 'studio.html');
      }
    }
    if (!companies.length && !sub) {
      el.innerHTML = `<div class="page-head"><div><h1>Content Studio</h1></div></div><section class="card">${UI.empty('building', 'No company to write for yet', all.length ? 'Request access to a company, or wait for approval, then come back.' : 'Companies appear once they register and complete their brand setup.', '<a class="btn btn-primary" href="companies.html">Find companies</a>')}</section>`; return;
    }
    if (sub && sub.image) curImage = sub.image;
    const pre = (sub && sub.companyId) || UI.q('company') || (companies.length ? companies[0].id : '');
    const latest = () => sub.versions[sub.versions.length - 1];
    const locked = () => sub && sub.status !== 'draft';

    el.innerHTML = `<div class="page-head"><div><h1>Content Studio</h1><p>Write your content, check it against the company’s rules, fix the issues, then submit it for approval.</p></div><div class="row" style="gap:10px;align-items:center"><button type="button" class="btn btn-sm" id="delDraftBtn" style="display:none;background:#FEF2F2;border:1px solid #FECACA;color:#B91C1C;font-weight:600">${UI.icon("trash", 14)} Delete</button><div id="statusBadge"></div></div></div>
      <div id="notice"></div>
      <div class="grid-2">
        <div class="stack">
          <div class="row between" style="margin-bottom:12px;background:#F8FAFC;padding:10px 14px;border:1px solid var(--line);border-radius:var(--r-m)">
            <span class="muted small"><b>Hackathon Judge Demo:</b> Test compliance check with pre-built sample content:</span>
            <div class="row" style="gap:8px;flex-wrap:wrap">
              <button type="button" class="btn btn-sm" id="previewBtn">${UI.icon("eye", 14)} Live Preview</button><label class="btn btn-sm" style="margin:0;cursor:pointer">${UI.icon('file-text', 14)} Import .txt/.md<input type="file" id="importDoc" accept=".txt,.md,text/plain,text/markdown" style="display:none"></label>
              <button type="button" class="btn btn-sm" id="loadSampleBtn" style="border:1px dashed #6366f1;color:#4f46e5;background:#EEF2FF;font-weight:600">
                ${UI.icon('sparkles', 15)} Load Sample Test Post
              </button>
            </div>
          </div>
          <form class="card card-pad" id="f" novalidate>
            <div class="row" style="align-items:flex-start;gap:16px">
              <div class="field grow" style="min-width:200px"><label for="co">Company</label><select class="select" id="co"><option value="">Choose a company…</option>${companies.map(c => `<option value="${c.id}" ${c.id === pre ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}</select><span class="err" id="e-co"></span></div>
              <div class="field" style="min-width:190px"><label for="ch">Content type</label><select class="select" id="ch">${CHANNELS.map(c => `<option ${sub && sub.channel === c ? 'selected' : ''}>${c}</option>`).join('')}</select></div>
            </div>
            <div class="field"><label for="title">Content title</label><input class="input" id="title" maxlength="120" placeholder="e.g. X1 launch post" value="${esc(sub ? sub.title : '')}"><span class="err" id="e-title"></span></div>
            <div class="field"><label for="text">Your content</label><textarea class="textarea" id="text" style="min-height:210px" placeholder="Write or paste the caption, description or message you want to publish.">${esc(sub ? latest().text : '')}</textarea><span class="err" id="e-text"></span></div>
            <div id="piiBar" style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 12px;margin:-4px 0 12px;background:#F8FAFC;border:1px solid var(--line);border-radius:var(--r-m);flex-wrap:wrap">
              <div style="display:flex;align-items:center;gap:8px;font-size:.82rem">
                ${UI.icon('shield', 15)}
                <span id="piiStatus" class="muted">PII Shield: No sensitive data detected</span>
              </div>
              <div style="display:flex;align-items:center;gap:8px">
                <label style="display:flex;align-items:center;gap:5px;font-size:.78rem;cursor:pointer;margin:0"><input type="checkbox" id="piiAuto" ${sub && sub.piiMasked ? 'checked' : ''}> Auto-mask on check</label>
                <button type="button" class="btn btn-sm" id="maskPiiBtn" style="display:none">Mask PII now</button>
              </div>
            </div>
            <div class="field" style="padding:12px;border:1px dashed var(--line);border-radius:var(--r-m);background:#FAFBFC">
              <div class="row between" style="margin-bottom:8px;flex-wrap:wrap;gap:8px">
                <label style="margin:0;display:flex;align-items:center;gap:6px">${UI.icon('image', 15)} Visual Asset &amp; Accessibility Scanner <span class="badge b-muted">Optional</span></label>
                <div class="row" style="gap:6px">
                  <button type="button" class="btn btn-sm" id="coAssetBtn">${UI.icon('building', 14)} Use Company Asset</button>
                  <button type="button" class="btn btn-sm" id="sampleBannerBtn" style="border:1px dashed #0d9488;color:#0f766e;background:#F0FDFA">${UI.icon('sparkles', 14)} Sample Ad Banner</button>
                  <label class="btn btn-sm" style="margin:0;cursor:pointer">Upload Image<input type="file" id="imgFile" accept="image/png,image/jpeg,image/webp" style="display:none"></label>
                  <button type="button" class="btn btn-ghost btn-sm" id="clearImgBtn" style="display:none">Remove</button>
                </div>
              </div>
              <div id="imgPreviewWrap" style="display:none;margin-top:10px">
                <div class="row" style="align-items:flex-start;gap:12px;flex-wrap:wrap">
                  <img id="imgPreview" alt="Uploaded asset preview" style="max-width:180px;max-height:110px;border-radius:8px;border:1px solid var(--line);object-fit:cover">
                  <div class="grow" style="min-width:200px">
                    <label for="altText" style="font-size:.78rem;margin-bottom:4px">Image Alt-Text (WCAG Accessibility)</label>
                    <input class="input" id="altText" maxlength="200" placeholder="Describe the image for screen readers…" value="${esc(sub && sub.altText ? sub.altText : '')}">
                    <div id="visionSummary" class="muted small" style="margin-top:6px"></div>
                  </div>
                </div>
              </div>
            </div>
            <div class="row between"><span class="muted small"><span id="count">0</span> characters · <span class="saved" id="saved"></span></span>
              <div class="row"><button type="button" class="btn" id="save">Save draft</button><button type="submit" class="btn btn-accent" id="check">${UI.icon('sparkles', 16)}Check content</button><button type="button" class="btn btn-primary" id="submit">${UI.icon('send', 16)}Submit for approval</button></div></div>
            <p class="hint" id="submitHint" style="margin-top:8px;text-align:right"></p>
          </form>
          <div id="coAssetPicker" style="display:none;margin-bottom:12px"></div><div id="previewCard"></div><div id="hlCard"></div>
        </div>
        <div class="stack" id="side"></div>
      </div>`;

    function text() { return $('text').value; }
    function dirty() { return !sub || text().trim() !== latest().text.trim(); }
    function valid() {
      const e = { co: $('co').value ? '' : 'Choose a company.', title: $('title').value.trim() ? '' : 'Enter a content title.', text: text().trim().length >= 10 ? '' : 'Write at least a sentence of content.' };
      Object.entries(e).forEach(([k, m]) => { $('e-' + k).textContent = m; (k === 'co' ? $('co') : $(k)).classList.toggle('invalid', !!m); });
      return !Object.values(e).some(Boolean);
    }
    function quiet() { return $('co').value && $('title').value.trim() && text().trim().length >= 10; }

    function refreshPiiAndMedia() {
      const pii = BrandTrust.scanPII(text());
      const ps = $('piiStatus'), pb = $('maskPiiBtn');
      if (ps && pb) {
        if (pii.hasPII) {
          ps.innerHTML = `<b style="color:#B45309">${pii.count} sensitive item(s) detected</b> (${[...new Set(pii.items.map(i => i.label))].join(', ')})`;
          pb.style.display = 'inline-flex';
        } else {
          ps.textContent = (sub && sub.piiMasked) ? 'PII Shield: Sensitive data redacted before check' : 'PII Shield: No sensitive data detected';
          pb.style.display = 'none';
        }
      }
      const wrap = $('imgPreviewWrap'), clr = $('clearImgBtn'), prev = $('imgPreview'), vs = $('visionSummary');
      if (wrap && clr && prev) {
        if (curImage) {
          wrap.style.display = 'block'; clr.style.display = 'inline-flex'; prev.src = curImage;
          if (sub && sub.visionMeta && vs) {
            const m = sub.visionMeta;
            const swatches = m.dominantColors.slice(0, 3).map(dc => `<span title="${dc.hex} (ΔE ${dc.deltaE})" style="display:inline-block;width:14px;height:14px;border-radius:3px;background:${dc.hex};border:1px solid #cbd5e1;vertical-align:middle;margin-right:3px"></span>`).join('');
            const logoTag = m.logoChecked ? (m.logoVerified ? ' · <span style="color:#14703A;font-weight:600">✓ Official Logo Verified</span>' : ' · <span style="color:#B45309;font-weight:600">⚠ Official Logo Missing</span>') : '';
            vs.innerHTML = `${swatches} <span>Contrast: <b>${m.contrastRatio}:1</b> (min ${m.minContrast}:1)</span> · <span>${esc(m.aspectLabel)}</span>${logoTag}`;
          } else if (vs) {
            vs.textContent = 'Ready — click "Check content" to run CIELAB palette & WCAG contrast scan.';
          }
        } else {
          wrap.style.display = 'none'; clr.style.display = 'none';
        }
      }
    }

    function paint() {
      refreshPiiAndMedia();
      const checked = sub && latest().findings !== null;
      const vf = (checked && sub.visionFindings) ? sub.visionFindings : [];
      const f = checked ? latest().findings.concat(vf) : [], c = BrandCheck.counts(f), d = dirty();
      $('statusBadge').innerHTML = sub ? UI.badge(sub.status) : '<span class="badge b-muted">New</span>';
      $('count').textContent = text().length;
      $('save').classList.toggle('hide', !!locked());
      const canDel = sub && ['draft', 'ai_checked'].includes(sub.status);
      if ($('delDraftBtn')) $('delDraftBtn').style.display = canDel ? 'inline-flex' : 'none';
      $('co').disabled = !!locked(); $('title').disabled = !!locked(); $('ch').disabled = !!locked();
      $('check').innerHTML = (checked ? UI.icon('sparkles', 16) + 'Check again' : UI.icon('sparkles', 16) + 'Check content');
      const can = checked && !d && !busy; $('submit').disabled = !can;
      $('submit').innerHTML = UI.icon('send', 16) + (sub && sub.status === 'changes_requested' ? 'Resubmit for approval' : 'Submit for approval');
      $('submitHint').textContent = !checked ? 'Check your content first. Submitting is a separate step.' : d ? 'You changed the text. Check it again before submitting.' : '';
      const lastCo = sub && sub.comments.slice().reverse().find(x => x.role === 'company');
      $('notice').innerHTML = sub && sub.status === 'changes_requested' ? UI.banner('warn', sub.companyName + ' asked for changes', lastCo ? ' “' + lastCo.text + '” Revise the content, check it again, then resubmit.' : ' Revise the content, check it again, then resubmit.') : '';

    function buildChannelPreview(ch, coName, author, text, img, alt, logoUrl) {
      const creatorName = author || 'Content Creator';
      const avatar = `<div class="avatar" style="width:36px;height:36px;font-size:13px">${esc(UI.initials(creatorName))}</div>`;
      const isAd = /ad/i.test(ch), isLi = /linkedin/i.test(ch), isX = /^x /i.test(ch);
      const footer = isAd
        ? `<div style="display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:#F8FAFC;border-top:1px solid var(--line)"><span class="small muted">Sponsored · ${esc(coName)}</span><span class="btn btn-primary btn-sm" style="pointer-events:none;font-size:.78rem">Learn More →</span></div>`
        : isLi
        ? `<div style="display:flex;justify-content:space-around;padding:8px 14px;border-top:1px solid #f1f5f9;color:#64748b;font-size:.8rem;font-weight:600"><span>👍 Like</span><span>💬 Comment</span><span>🔁 Repost</span><span>➤ Send</span></div>`
        : isX
        ? `<div style="display:flex;justify-content:space-between;padding:8px 16px;border-top:1px solid #f1f5f9;color:#64748b;font-size:.8rem"><span>💬 12</span><span>🔁 8</span><span>❤️ 64</span><span>📊 1.2K</span></div>`
        : `<div style="display:flex;justify-content:space-between;padding:9px 14px;border-top:1px solid #f1f5f9;font-size:.85rem;color:#334155"><span>♡ &nbsp; 💬 &nbsp; ➤</span><span>🔖</span></div>`;
      return `<div style="max-width:440px;margin:0 auto;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff;box-shadow:0 4px 18px rgba(15,23,42,.06)">
        <div class="row" style="padding:11px 14px;gap:10px;border-bottom:1px solid #f1f5f9">${avatar}<div class="grow"><div style="display:flex;align-items:center;gap:5px"><b style="font-size:.9rem">${esc(creatorName)}</b><span style="display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:50%;background:#0ea5e9;color:#fff;font-size:10px;font-weight:700">✓</span></div><div class="muted small" style="font-size:.74rem">${esc(ch)} · for <b>${esc(coName)}</b></div></div><span class="muted" style="font-weight:700">···</span></div>
        ${img ? `<div style="background:#0f172a;display:flex;justify-content:center"><img src="${img}" alt="${esc(alt || '')}" style="width:100%;max-height:280px;object-fit:contain;display:block"></div>` : ''}
        <div style="padding:12px 14px;font-size:.9rem;white-space:pre-wrap;line-height:1.5;color:#0f172a">${esc(text || 'Your post copy will appear here…')}</div>
        ${alt ? `<div style="padding:5px 14px 8px;font-size:.74rem;color:#64748b">ALT: ${esc(alt)}</div>` : ''}
        ${footer}
      </div>`;
    }
      const pv = $('previewCard');
      if (pv) {
        if (showPreview) {
          const coName = $('co').selectedOptions[0] ? $('co').selectedOptions[0].text : 'Company';
          const altVal = $('altText') ? $('altText').value : '';
          pv.innerHTML = `<section class="card" style="margin-bottom:14px"><div class="card-head"><h2>Live ${esc($('ch').value)} Preview</h2><button type="button" class="btn btn-ghost btn-sm" id="closePreviewBtn">Close</button></div>
            <div class="card-body" style="background:#F8FAFC">${buildChannelPreview($('ch').value, coName, ctx.user.name, text(), curImage, altVal, '')}</div></section>`;
        } else { pv.innerHTML = ''; }
      }
      $('hlCard').innerHTML = checked && !d ? `<section class="card"><div class="card-head"><h2>Highlighted issues</h2><span class="muted small">Click a highlight to jump to its finding</span></div><div class="card-body"><div class="draft">${UI.highlight(latest().text, f)}</div></div></section>` : '';
      $('side').innerHTML = !checked ? `<section class="card card-pad"><h2 style="margin-bottom:6px">Brand check</h2><p class="muted small">Press <b>Check content</b> to compare your text with the company’s rules and approved facts. You will see each issue, the rule behind it and a suggested fix.</p></section>`
        : `<section class="card card-pad"><div class="row between" style="margin-bottom:10px"><h2>Compliance score</h2><span class="badge b-muted">Rule-based check</span></div>${d ? '<p class="muted small" style="margin-bottom:10px">Showing the last checked version. Check again to update it.</p>' : ''}${UI.scoreCard(f)}</section>
          <section><div class="row between" style="margin-bottom:6px"><h2>Findings</h2>${!d && !busy && f.some(x => x.fix && x.decision !== 'dismissed') ? `<button type="button" class="btn btn-primary btn-sm" id="fixAllBtn">${UI.icon('sparkles', 14)} Fix All Safe Issues (${f.filter(x => x.fix && x.decision !== 'dismissed').length})</button>` : ''}</div><p class="muted small" style="margin-bottom:12px">“Needs verification” means no approved fact covers it. It does not prove the claim is wrong. Only the company can approve content.</p>
          ${c.total === 0 ? UI.banner('ok', 'No issues found', ' Your content matches ' + sub.companyName + '’s approved rules and facts.') : UI.groupedFindings(f, { actions: !d && !busy })}</section>`;
    }

    async function persistDraft(auto) {
      const altVal = $('altText') ? $('altText').value : '';
      const piiVal = $('piiAuto') ? $('piiAuto').checked : false;
      sub = await API.saveDraft({ id: sub ? sub.id : null, companyId: $('co').value, title: $('title').value, channel: $('ch').value, text: text(), image: curImage, altText: altVal, piiMasked: piiVal });
      lastSaved = new Date(); $('saved').textContent = (auto ? 'Autosaved ' : 'Saved ') + lastSaved.toLocaleTimeString('en-IN', { hour: 'numeric', minute: '2-digit' });
      history.replaceState(null, '', 'studio.html?draft=' + sub.id);
    }
    async function run(fn, ok) {
      if (busy) return; busy = true; $('check').disabled = $('save').disabled = true; paint();
      try { const r = await fn(); if (ok) UI.toast(typeof ok === 'function' ? ok(r) : ok, 'ok'); ctx.refreshBell(); }
      catch (e) { UI.toast(e.message, 'bad'); }
      busy = false; $('check').disabled = $('save').disabled = false; paint();
    }

    // autosave (drafts only, when the form is valid)
    function schedule() { clearTimeout(saveTimer); if (locked()) return; saveTimer = setTimeout(async () => { if (busy || !quiet() || (sub && !dirty() && sub.title === $('title').value.trim())) return; try { await persistDraft(true); paint(); } catch (e) { $('saved').textContent = 'Autosave failed: ' + e.message; } }, 1500); }
    ['text', 'title'].forEach(i => $(i).addEventListener('input', () => { paint(); schedule(); }));
    ['co', 'ch'].forEach(i => $(i).addEventListener('change', () => { paint(); schedule(); }));

    const sampleBtn = $('loadSampleBtn');
    if (sampleBtn) {
      sampleBtn.onclick = () => {
        if (companies.length) $('co').value = companies[0].id;
        $('ch').value = 'Instagram Post';
        $('title').value = 'Festive Season Promotional Launch';
        $('text').value = 'Our brand offers the most cheapest smartphones in India. Everyone can get premium quality at the lowest price guaranteed!';
        paint(); schedule();
        UI.toast('Sample post loaded! Click "Check content" to see AI findings.', 'ok');
      };
    }

        $('delDraftBtn').onclick = async () => {
      if (busy || !sub || !['draft', 'ai_checked'].includes(sub.status)) return;
      const ok = await UI.confirmBox({ title: 'Delete this draft?', message: 'This unsubmitted draft will be permanently removed from your workspace.', confirmText: 'Delete draft', danger: true });
      if (!ok) return;
      clearTimeout(saveTimer);
      try {
        await API.deleteDraft(sub.id);
        UI.toast('Draft deleted.', 'ok');
        location.href = 'submissions.html?status=draft';
      } catch (err) { UI.toast(err.message, 'bad'); }
    };
    $('save').onclick = () => { clearTimeout(saveTimer); if (!valid()) return; run(() => persistDraft(false), 'Draft saved.'); };
    $('importDoc').onchange = e => {
      const f = e.target.files && e.target.files[0]; if (!f) return;
      const r = new FileReader();
      r.onload = () => {
        const content = String(r.result || '').trim();
        if (!$('title').value.trim()) $('title').value = f.name.replace(/\.[^.]+$/, '');
        $('text').value = content;
        paint(); schedule();
        UI.toast('Imported draft from ' + f.name, 'ok');
      };
      r.readAsText(f);
    };
    $('previewBtn').onclick = () => { showPreview = !showPreview; paint(); if (showPreview && $('previewCard')) $('previewCard').scrollIntoView({ behavior: 'smooth', block: 'nearest' }); };
    $('coAssetBtn').onclick = async () => {
      const box = $('coAssetPicker');
      if (box.style.display === 'block') { box.style.display = 'none'; return; }
      const coId = $('co').value;
      if (!coId) return UI.toast('Choose a company first.', 'bad');
      try {
        const g = await API.getCompany(coId);
        const list = (g.guidelines && g.guidelines.brandAssets) || [];
        const logo = g.guidelines && g.guidelines.brandLogo;
        const allAssets = (logo ? [{ id: 'logo', title: g.name + ' Official Logo', type: 'logo', dataUrl: logo }] : []).concat(list);
        box.style.display = 'block';
        box.innerHTML = `<section class="card card-pad"><div class="row between" style="margin-bottom:8px"><b>Approved Assets from ${esc(g.name)}</b><button type="button" class="btn btn-ghost btn-sm" onclick="document.getElementById('coAssetPicker').style.display='none'">Close</button></div>
          ${allAssets.length ? `<div class="row" style="gap:10px;flex-wrap:wrap">${allAssets.map(a => `<button type="button" class="card" data-pick-asset="${esc(a.dataUrl)}" data-pick-title="${esc(a.title)}" style="padding:8px;cursor:pointer;text-align:left;width:135px"><img src="${a.dataUrl}" style="width:100%;height:70px;object-fit:contain;border-radius:4px;background:#f8fafc"><div class="small" style="margin-top:4px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(a.title)}</div></button>`).join('')}</div>` : '<p class="muted small">This company has not uploaded any visual assets yet.</p>'}</section>`;
      } catch (err) { UI.toast(err.message, 'bad'); }
    };
    $('maskPiiBtn').onclick = () => {
      const res = BrandTrust.maskPII(text());
      if (!res.count) return;
      $('text').value = res.maskedText;
      if ($('piiAuto')) $('piiAuto').checked = true;
      paint(); schedule();
      UI.toast(`Masked ${res.count} sensitive item(s) locally before analysis.`, 'ok');
    };
    $('sampleBannerBtn').onclick = () => {
      curImage = BrandVision.generateSampleBanner();
      if ($('altText')) $('altText').value = '';
      paint(); schedule();
      UI.toast('Sample promotional banner loaded! Click "Check content" to run Vision + Text scan.', 'ok');
    };
    $('imgFile').onchange = e => {
      const file = e.target.files && e.target.files[0]; if (!file) return;
      const r = new FileReader();
      r.onload = async () => { curImage = await BrandVision.compressImage(r.result, 800, 0.82); paint(); schedule(); UI.toast('Image compressed & attached. Click "Check content" to scan.', 'ok'); };
      r.readAsDataURL(file);
    };
    $('clearImgBtn').onclick = () => { curImage = null; if ($('altText')) $('altText').value = ''; paint(); schedule(); };
    if ($('altText')) $('altText').addEventListener('input', () => schedule());

    $('f').onsubmit = ev => {
      ev.preventDefault(); clearTimeout(saveTimer); if (!valid()) return;
      if ($('piiAuto') && $('piiAuto').checked) {
        const res = BrandTrust.maskPII(text());
        if (res.count) { $('text').value = res.maskedText; UI.toast(`PII Shield masked ${res.count} item(s).`, 'ok'); }
      }
      run(async () => {
        const altVal = $('altText') ? $('altText').value : '';
        const piiVal = $('piiAuto') ? $('piiAuto').checked : false;
        if (!sub || sub.status === 'draft') { await persistDraft(false); sub = await API.analyse(sub.id); }
        else {
          await API.updateMedia(sub.id, { image: curImage, altText: altVal, piiMasked: piiVal });
          if (dirty()) sub = await API.saveEdit(sub.id, text());
          else sub = await API.analyse(sub.id);
        }
        $('text').value = latest().text;
        if ($('altText')) $('altText').value = sub.altText || '';
        return sub;
      }, s => 'Checked: ' + (latest().findings.length + (sub.visionFindings || []).length) + ' finding(s).');
    };
    $('submit').onclick = async () => {
      if (busy || !sub || dirty() || latest().findings === null) return;
      const open = BrandCheck.counts(latest().findings).open;
      const ok = await UI.confirmBox({ title: 'Submit for approval?', confirmText: 'Submit', message: open ? open + ' finding' + (open > 1 ? 's are' : ' is') + ' still open. ' + sub.companyName + ' will see them. Submit anyway?' : 'Your content will be sent to ' + sub.companyName + '.' });
      if (!ok) return;
      busy = true; paint(); $('submit').innerHTML = '<span class="spinner"></span> Submitting…';
      try { const r = await API.submitForReview(sub.id); UI.toast(r.status === 'approved' ? 'Approved automatically. No issues were found.' : 'Submitted to ' + r.companyName + '.', 'ok'); location.href = 'report.html?id=' + sub.id; }
      catch (e) { UI.toast(e.message, 'bad'); busy = false; paint(); }
    };

    el.addEventListener('click', async e => {
      if (e.target.closest('#closePreviewBtn')) { showPreview = false; return paint(); }
      const pa = e.target.closest('[data-pick-asset]');
      if (pa) {
        curImage = pa.dataset.pickAsset;
        if ($('altText') && !$('altText').value) $('altText').value = pa.dataset.pickTitle;
        $('coAssetPicker').style.display = 'none';
        paint(); schedule();
        UI.toast('Attached approved asset: ' + pa.dataset.pickTitle, 'ok');
        return;
      }
      if (e.target.closest('#fixAllBtn')) {
        return run(async () => {
          sub = await API.applyAllFixes(sub.id);
          $('text').value = latest().text;
          if ($('altText')) $('altText').value = sub.altText || '';
        }, 'All safe automated fixes applied and content re-checked!');
      }
      const mk = e.target.closest('mark.hl'); if (mk) return UI.flash('#fc-' + mk.dataset.fid);
      const fc = e.target.closest('.finding'); if (fc && !e.target.closest('button')) return UI.flash(`mark[data-fid="${fc.dataset.fid}"]`);
      const b = e.target.closest('[data-act]'); if (!b || !fc) return; const fid = fc.dataset.fid, a = b.dataset.act;
      if (a === 'accept') return run(async () => { sub = await API.applyFix(sub.id, fid); $('text').value = latest().text; if ($('altText')) $('altText').value = sub.altText || ''; }, 'Suggestion applied and content re-checked.');
      if (a === 'dismiss') return run(async () => { sub = await API.dismissFinding(sub.id, fid); }, 'Finding dismissed. The company can still see it.');
      if (a === 'edit') { const f = latest().findings.find(x => x.id === fid), t = $('text'); t.scrollIntoView({ behavior: 'smooth', block: 'center' }); t.focus(); if (f && f.start >= 0 && !dirty()) t.setSelectionRange(f.start, f.end); }
    });
    window.addEventListener('beforeunload', ev => { if (!locked() && quiet() && dirty() && !busy) { ev.preventDefault(); ev.returnValue = ''; } });
    $('count').textContent = text().length; paint();
    if (sub) $('saved').textContent = 'Last updated ' + UI.fmtDate(sub.updatedAt);
  } catch (e) { el.innerHTML = UI.empty('alert', 'Could not open Content Studio', e.message, '<button class="btn" onclick="location.reload()">Retry</button>'); }
})();
</script></body></html>
