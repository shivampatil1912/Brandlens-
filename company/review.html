<!doctype html>
<html lang="en" data-base="../">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Review Details · BrandLens</title>
<link rel="icon" href="../assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>/* BrandLens Embedded CSS */
/* BrandLens design system — light workspace, navy structure, purple/cyan used sparingly */
:root{
  --bg:#F5F6FA; --surface:#FFFFFF; --line:#E2E5EF; --line-2:#EEF0F6;
  --text:#101437; --muted:#5F6A86; --faint:#8A93AB;
  --navy:#090D20; --navy-2:#141A3D; --navy-3:#262E66;
  --purple:#7447ED; --cyan:#28BCEB; --grad:linear-gradient(90deg,#7447ED 0%,#28BCEB 100%);
  --ok:#14703A; --ok-bg:#DDF5E6; --warn:#8A4B06; --warn-bg:#FDF0CF; --bad:#9F1D1D; --bad-bg:#FDE3E3; --info:#2A3AA8; --info-bg:#E4E8FD;
  --r-s:8px; --r-m:12px; --r-l:18px;
  --font:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:var(--font);font-size:15px;line-height:1.55;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;line-height:1.2;letter-spacing:-.01em}
h1{font-size:26px;font-weight:700} h2{font-size:17px;font-weight:650} h3{font-size:15px;font-weight:650}
p{margin:0} a{color:inherit} img{max-width:100%;display:block}
.muted{color:var(--muted)} .faint{color:var(--faint)} .small{font-size:13px} .center{text-align:center}
.ic{flex:none;vertical-align:-3px}
:focus-visible{outline:2px solid var(--purple);outline-offset:2px;border-radius:4px}

/* ---------- Buttons & fields ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:inherit;font-weight:600;font-size:14px;padding:10px 16px;border-radius:var(--r-s);border:1px solid var(--line);background:var(--surface);color:var(--text);cursor:pointer;text-decoration:none;transition:background .15s,border-color .15s,transform .05s;white-space:nowrap}
.btn:hover{background:#F0F2FA;border-color:#CDD2E4}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.btn-primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn-primary:hover{background:var(--navy-2);border-color:var(--navy-2)}
.btn-accent{background:var(--grad);border:0;color:#101437;padding:11px 18px}
.btn-accent:hover{filter:brightness(1.06);background:var(--grad)}
.btn-danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn-danger:hover{background:#821818;border-color:#821818}
.btn-ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn-ghost:hover{background:#EBEEF8;color:var(--text);border-color:transparent}
.btn-sm{padding:6px 11px;font-size:13px}
.btn-block{width:100%}
.spinner{width:16px;height:16px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .7s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}

.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.field>label,.label{font-weight:600;font-size:13.5px}
.hint{font-size:12.5px;color:var(--muted)}
.input,.textarea,.select{font:inherit;width:100%;padding:10px 12px;border:1px solid #CBD0E2;border-radius:var(--r-s);background:#fff;color:var(--text)}
.textarea{min-height:130px;resize:vertical;line-height:1.55}
.input:focus,.textarea:focus,.select:focus{outline:2px solid rgba(124,92,252,.35);border-color:var(--purple)}
.input.invalid,.textarea.invalid,.select.invalid{border-color:var(--bad)}
.err{color:var(--bad);font-size:12.5px;min-height:0}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.check input{margin-top:4px;accent-color:var(--navy)}
.form-error{background:var(--bad-bg);color:var(--bad);border-radius:var(--r-s);padding:10px 12px;font-size:13.5px;margin-bottom:14px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.grow{flex:1;min-width:0}

/* ---------- Panels ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m)}
.card-pad{padding:20px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line-2)}
.card-body{padding:20px}
.stack>*+*{margin-top:16px}
.grid-2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px;align-items:start}
.grid-eq{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.page-head p{margin-top:4px;color:var(--muted)}

.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:16px 18px}
.stat b{display:block;font-size:30px;line-height:1.1;font-weight:700;letter-spacing:-.02em}
.stat span{color:var(--muted);font-size:13px}
.stat.hot{border-color:#C9BEFF;background:linear-gradient(180deg,#F6F3FF,#fff)}

/* ---------- Badges ---------- */
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;background:#EEF0F6;color:var(--muted);white-space:nowrap}
.b-ok{background:var(--ok-bg);color:var(--ok)} .b-warn{background:var(--warn-bg);color:var(--warn)}
.b-bad{background:var(--bad-bg);color:var(--bad)} .b-info{background:var(--info-bg);color:var(--info)}
.b-muted{background:#EEF0F6;color:var(--muted)}

/* ---------- Tables ---------- */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:600;font-size:12.5px;color:var(--muted);padding:10px 16px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:13px 16px;border-bottom:1px solid var(--line-2);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:#FAFBFE}
td .sub{color:var(--muted);font-size:12.5px}
.t-title{font-weight:600}

/* ---------- Tabs & chips ---------- */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow-x:auto}
.tab{font:inherit;font-weight:600;font-size:14px;color:var(--muted);background:none;border:0;border-bottom:2px solid transparent;padding:10px 14px;cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--text)}
.tab.on{color:var(--text);border-bottom-color:var(--purple)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font:inherit;font-size:13px;font-weight:600;padding:6px 12px;border:1px solid var(--line);background:#fff;border-radius:99px;cursor:pointer;color:var(--muted)}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}

/* ---------- Banners, empty ---------- */
.banner{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:var(--r-m);margin-bottom:18px;font-size:14px;border:1px solid transparent}
.banner.info{background:var(--info-bg);color:#22308F} .banner.warn{background:var(--warn-bg);color:var(--warn)}
.banner.ok{background:var(--ok-bg);color:var(--ok)} .banner.bad{background:var(--bad-bg);color:var(--bad)}
.banner strong{display:block}
.empty{text-align:center;padding:44px 20px;color:var(--muted)}
.empty .ic-wrap{width:48px;height:48px;border-radius:50%;background:#ECEEF8;display:grid;place-items:center;margin:0 auto 12px;color:var(--navy-3)}
.empty h3{color:var(--text);margin-bottom:4px}
.empty .btn{margin-top:14px}
.loading{padding:60px 20px;text-align:center;color:var(--muted)}

/* ---------- List items ---------- */
.item-list{list-style:none;margin:0;padding:0}
.item{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line-2)}
.item:last-child{border-bottom:0}
.item .grow{font-size:14px}
.item .x{background:none;border:0;color:var(--faint);cursor:pointer;padding:4px;border-radius:6px}
.item .x:hover{color:var(--bad);background:var(--bad-bg)}
.arrow{color:var(--faint);padding:0 6px}
.kv{display:grid;grid-template-columns:130px 1fr;gap:6px 14px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0}

/* ---------- App shell ---------- */
.app{display:flex;min-height:100vh}
.sidebar{width:248px;background:var(--navy);color:#C5CBEA;display:flex;flex-direction:column;padding:18px 14px;position:fixed;inset:0 auto 0 0;z-index:30;transition:transform .2s}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:#fff;font-weight:700;font-size:18px;letter-spacing:-.01em;padding:4px 8px 16px}
.brand img{width:34px;height:34px;border-radius:9px}
.ws{margin:0 4px 14px;padding:10px 12px;border-radius:var(--r-s);background:rgba(255,255,255,.07);font-size:13px;line-height:1.35}
.ws b{display:block;color:#fff;font-size:14px;word-break:break-word}
.nav{display:flex;flex-direction:column;gap:2px;flex:1}
.nav a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:var(--r-s);color:#B9C0E4;text-decoration:none;font-weight:500;font-size:14.5px;position:relative}
.nav a:hover{background:rgba(255,255,255,.07);color:#fff}
.nav a.on{background:rgba(255,255,255,.1);color:#fff}
.nav a.on::before{content:"";position:absolute;left:-14px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--grad)}
.side-foot{border-top:1px solid rgba(255,255,255,.1);padding-top:12px}
.side-foot button{width:100%;display:flex;gap:11px;align-items:center;background:none;border:0;color:#B9C0E4;font:inherit;font-size:14.5px;padding:10px 12px;border-radius:var(--r-s);cursor:pointer}
.side-foot button:hover{background:rgba(255,255,255,.07);color:#fff}
.main{flex:1;margin-left:248px;min-width:0;display:flex;flex-direction:column}
.topbar{height:62px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 24px;position:sticky;top:0;z-index:20}
.topbar .t{font-weight:650;font-size:16px}
.burger{display:none}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--navy-3);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px}
.me{display:flex;gap:10px;align-items:center}
.me .who{line-height:1.25;font-size:13px}.me .who b{display:block;font-size:13.5px}
.content{padding:28px 28px 60px;max-width:1240px;width:100%}
.bell{position:relative}
.bell-btn{position:relative;background:none;border:1px solid var(--line);border-radius:var(--r-s);width:38px;height:38px;display:grid;place-items:center;cursor:pointer;color:var(--text)}
.bell-btn:hover{background:#F0F2FA}
.dot{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;border-radius:9px;background:var(--purple);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px}
.bell-panel{position:absolute;right:0;top:46px;width:340px;max-width:90vw;background:#fff;border:1px solid var(--line);border-radius:var(--r-m);box-shadow:0 12px 32px rgba(16,20,55,.14);display:none;overflow:hidden}
.bell-panel.open{display:block}
.bell-panel header{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line-2);font-weight:650}
.bell-panel a.n{display:block;padding:11px 14px;border-bottom:1px solid var(--line-2);text-decoration:none;font-size:13.5px}
.bell-panel a.n:hover{background:#F8F9FD}
.bell-panel a.n.unread{background:#F6F3FF}
.bell-panel a.n small{display:block;color:var(--faint);margin-top:2px}
.bell-list{max-height:380px;overflow-y:auto}
.notif{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line-2);font-size:14px;text-decoration:none;color:inherit}
.notif:last-child{border-bottom:0}
.notif .ico{width:32px;height:32px;border-radius:50%;background:#EEEBFF;color:var(--purple);display:grid;place-items:center;flex:none}
.notif small{display:block;color:var(--faint)}

/* ---------- Toasts & modal ---------- */
.toasts{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:10px;z-index:100}
.toast{background:var(--navy);color:#fff;padding:12px 16px;border-radius:var(--r-s);font-size:14px;max-width:360px;box-shadow:0 8px 24px rgba(16,20,55,.25);animation:pop .18s ease-out}
.toast.bad{background:var(--bad)} .toast.ok{background:#12603A}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.backdrop{position:fixed;inset:0;background:rgba(16,20,55,.5);display:grid;place-items:center;z-index:90;padding:20px}
.modal{background:#fff;border-radius:var(--r-l);width:100%;max-width:440px;padding:24px}
.modal h2{margin-bottom:8px}.modal p{color:var(--muted);margin-bottom:20px}
.modal .row{justify-content:flex-end}

/* ---------- Findings & highlights ---------- */
.draft{white-space:pre-wrap;word-break:break-word;font-size:15.5px;line-height:1.75;max-width:70ch}
mark.hl{background:none;color:inherit;padding:1px 2px;border-radius:3px;cursor:pointer;border-bottom:2px solid}
mark.hl-high{background:#FDE3E3;border-color:#E04444} mark.hl-medium{background:#FDF0CF;border-color:#E39B1B} mark.hl-info{background:#E4E8FD;border-color:#6577E8}mark.hl-critical{background:#FBD0D0;border-color:#B91C1C}
mark.hl.flash{outline:3px solid rgba(124,92,252,.55)}
.finding{border:1px solid var(--line);border-left:4px solid var(--faint);border-radius:var(--r-s);padding:16px;background:#fff}
.finding.sev-high{border-left-color:#E04444}.finding.sev-medium{border-left-color:#E39B1B}.finding.sev-info{border-left-color:#6577E8}.finding.sev-critical{border-left-color:#B91C1C}
.finding.is-dismissed{opacity:.6;background:#FAFBFE}
.finding.flash{box-shadow:0 0 0 3px rgba(124,92,252,.4)}
.finding-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.sev{font-size:12px;font-weight:700}
.sev-high.sev{color:#C02828}.sev-medium.sev{color:#A8650A}.sev-info.sev{color:#3F52C9}.sev-critical.sev{color:#9F1D1D}
.cat{font-size:12.5px;color:var(--muted)}
.excerpt{margin:0 0 8px;padding:8px 12px;background:#F6F7FC;border-radius:6px;font-weight:600;word-break:break-word}
.excerpt.missing{font-weight:500;color:var(--muted);font-style:italic}
.why{margin-bottom:10px}
.finding .meta{display:grid;grid-template-columns:96px 1fr;gap:4px 12px;font-size:13px;margin:0 0 12px}
.finding .meta dt{color:var(--muted)}.finding .meta dd{margin:0}
.suggest{display:flex;gap:10px;background:#F4F1FF;border-radius:var(--r-s);padding:10px 12px;font-size:13.5px;color:#33288A}
.suggest .addition{margin-top:6px;padding:6px 8px;background:#fff;border-radius:6px;color:var(--text)}
.finding-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.timeline{list-style:none;margin:0;padding:0 0 0 14px;border-left:2px solid var(--line)}
.timeline li{position:relative;padding:0 0 14px 16px;font-size:13.5px}
.timeline li::before{content:"";position:absolute;left:-22px;top:5px;width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid var(--purple)}
.timeline small{display:block;color:var(--faint)}
.comment{padding:12px 14px;border-radius:var(--r-s);background:#F6F7FC;font-size:14px}
.comment+.comment{margin-top:10px}
.comment.company{background:#EEEBFF}
.comment b{font-size:13px}.comment small{color:var(--faint);margin-left:6px}
.comment p{margin-top:4px;white-space:pre-wrap}
.company-card{padding:18px;display:flex;flex-direction:column;gap:10px}
.company-card .logo-tile{width:42px;height:42px;border-radius:10px;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:700}
.search{position:relative;max-width:480px;width:100%}
.search .ic{position:absolute;left:12px;top:12px;color:var(--faint)}
.search .input{padding-left:38px}
.hide{display:none!important}

/* ---------- Landing ---------- */
.site-header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.site-header .in{max-width:1180px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;gap:28px}
.site-header .brand{color:var(--navy);padding:0}
.site-nav{display:flex;gap:22px;margin-left:auto;align-items:center}
.site-nav a{text-decoration:none;color:var(--muted);font-weight:500;font-size:14.5px}
.site-nav a:hover{color:var(--text)}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}
.hero{background:#fff;border-bottom:1px solid var(--line)}
.hero .wrap{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:56px;align-items:center;padding-top:72px;padding-bottom:72px}
.hero h1{font-size:clamp(34px,4.6vw,54px);font-weight:750;letter-spacing:-.03em;line-height:1.06}
.hero .lead{margin-top:18px;font-size:18px;color:var(--muted);max-width:52ch}
.portals{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:32px}
.hero-art{background:var(--navy);border-radius:var(--r-l);overflow:hidden;aspect-ratio:1/1;max-width:500px;justify-self:end;width:100%;box-shadow:0 30px 60px -20px rgba(18,22,58,.45)}
.hero-art img{width:100%;height:100%;object-fit:cover}
.section{padding:72px 0}
.section h2{font-size:30px;letter-spacing:-.02em;margin-bottom:10px}
.section .sub{color:var(--muted);max-width:56ch;margin-bottom:34px}
.step{padding:24px;border-right:1px solid var(--line)}
.step:last-child{border-right:0}
.step .n{width:30px;height:30px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px;margin-bottom:14px}
.step h3{margin-bottom:6px}.step p{font-size:14px;color:var(--muted)}
.features{display:grid;grid-template-columns:repeat(3,1fr);gap:28px 36px}
.feature .ico{width:40px;height:40px;border-radius:10px;background:#EEEBFF;color:var(--purple);display:grid;place-items:center;margin-bottom:12px}
.feature p{font-size:14px;color:var(--muted);margin-top:4px}
.about{background:#fff;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.about .wrap{max-width:820px}
.about p{color:var(--muted);font-size:16.5px;margin-bottom:14px}
.footer{padding:30px 0;color:var(--muted);font-size:13.5px}
.footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}

/* ---------- Auth ---------- */
.auth{min-height:100vh;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr)}
.auth-art{background:var(--navy);color:#fff;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:40px;gap:28px;text-align:center}
.auth-art img{width:min(380px,80%);border-radius:var(--r-l)}
.auth-art p{max-width:34ch;color:#C5CBEA;font-size:16px}
.auth-form{display:flex;align-items:center;justify-content:center;padding:40px 24px;background:#fff}
.auth-box{width:100%;max-width:410px}
.auth-box h1{font-size:25px;margin-bottom:6px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:#EEF0F7;border-radius:var(--r-s);padding:4px;margin:20px 0 24px}
.seg button{font:inherit;font-weight:600;font-size:14px;padding:9px;border:0;background:none;border-radius:6px;cursor:pointer;color:var(--muted)}
.seg button.on{background:#fff;color:var(--text);box-shadow:0 1px 3px rgba(16,20,55,.12)}
.switch{margin-top:18px;text-align:center;font-size:14px;color:var(--muted)}
.switch a{color:var(--navy);font-weight:600}
.dev-note{margin-top:20px;font-size:12.5px;background:#FFF8E1;border:1px solid #F5DD8A;border-radius:var(--r-s);padding:10px 12px;color:#6B5200}

/* ---------- Responsive ---------- */
@media (max-width:980px){
  .grid-2{grid-template-columns:1fr}
  .hero .wrap{grid-template-columns:1fr;padding-top:44px;padding-bottom:44px}
  .hero-art{justify-self:start;max-width:380px}
    .features{grid-template-columns:1fr 1fr}
}
@media (max-width:760px){
  .sidebar{transform:translateX(-100%)}
  body.nav-open .sidebar{transform:none;box-shadow:0 0 0 100vmax rgba(16,20,55,.45)}
  .main{margin-left:0}
  .burger{display:grid}
  .content{padding:20px 16px 60px}
  .topbar{padding:0 14px}
  .me .who{display:none}
  .auth{grid-template-columns:1fr}.auth-art{padding:28px 20px;gap:14px}.auth-art img{width:150px}.auth-art p{display:none}
  .portals{grid-template-columns:1fr}
  .site-nav a:not(.btn){display:none}
  .features{grid-template-columns:1fr}.step{border-right:0;border-bottom:1px solid var(--line)}.step:last-child{border-bottom:0}
  .kv{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

/* ---------- v2: bento, score, diff, groups ---------- */
a.stat{display:block;text-decoration:none;color:inherit;transition:border-color .15s,transform .15s}
a.stat:hover{border-color:var(--purple);transform:translateY(-2px)}
.bento{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:22px}
.bento .stat.big{grid-column:span 2;background:var(--navy);border-color:var(--navy);color:#fff;display:flex;flex-direction:column;justify-content:space-between;min-height:150px}
.bento .stat.big b{font-size:54px}.bento .stat.big span{color:#C5CBEA;font-size:14px}
.bento .stat.big .go{margin-top:10px;font-size:13.5px;font-weight:600;color:var(--cyan)}
@media (max-width:980px){.bento{grid-template-columns:1fr 1fr}.bento .stat.big{grid-column:span 2}}
.score{display:flex;gap:16px;align-items:center}
.ring{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;flex:none;background:conic-gradient(var(--c,#7447ED) calc(var(--v)*1%),#E7E9F3 0)}
.ring span{width:64px;height:64px;border-radius:50%;background:#fff;display:grid;place-items:center;font-weight:700;font-size:21px}
.score ul{list-style:none;margin:8px 0 0;padding:0;font-size:12.5px;color:var(--muted)}
.group-title{display:flex;align-items:center;gap:8px;margin:22px 0 10px;font-size:14.5px;font-weight:650}
.group-title:first-child{margin-top:0}
ins.d,del.d{text-decoration:none;border-radius:3px;padding:0 2px}
ins.d{background:#CFF3DC;color:#0E5A2C}del.d{background:#FBD3D3;color:#8F1A1A;text-decoration:line-through}
.diff{white-space:pre-wrap;word-break:break-word;line-height:1.8;font-size:15px}
.pill-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sev-b{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:99px}
.sevb-critical{background:#FBD0D0;color:#8F1A1A}.sevb-high{background:var(--bad-bg);color:var(--bad)}.sevb-medium{background:var(--warn-bg);color:var(--warn)}.sevb-info{background:var(--info-bg);color:var(--info)}
.radio-card{display:flex;gap:10px;align-items:flex-start;padding:14px;border:1px solid var(--line);border-radius:var(--r-s);margin-bottom:10px;cursor:pointer}
.radio-card input{margin-top:4px;accent-color:var(--navy)}
.saved{font-size:12.5px;color:var(--muted)}
.portal-actions{display:flex;gap:8px;margin-top:14px;flex-wrap:nowrap;align-items:center}\n.portal-actions .btn{white-space:nowrap;flex-shrink:0}
.portal-card{border:1px solid var(--line);border-radius:var(--r-l);padding:24px;background:#fff}
.portal-card.dark{background:var(--navy);border-color:var(--navy);color:#fff}
.portal-card.dark p{color:#B9C0E4}
.portal-card h3{font-size:19px;margin:12px 0 6px}.portal-card p{color:var(--muted);font-size:14.5px}
.portal-card .btn-ghost-w{background:transparent;border-color:rgba(255,255,255,.35);color:#fff}
.portal-card .btn-ghost-w:hover{background:rgba(255,255,255,.1)}
.steps3{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:var(--r-m);background:#fff;overflow:hidden}
.steps3 .step:nth-child(3){border-right:0}
@media (max-width:760px){.steps3{grid-template-columns:1fr}.steps3 .step{border-right:0;border-bottom:1px solid var(--line)}}

/* Password toggle & ms-reveal override */
input[type="password"]::-ms-reveal,
input[type="password"]::-ms-clear {
  display: none !important;
}
.pw-toggle {
  transition: color 0.15s ease;
}
.pw-toggle:hover {
  color: var(--text) !important;
}

</style>
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../style.css"></head>
<body><div id="app"></div>
<script src="../js/checker.js"></script><script src="../js/vision.js"></script><script src="../js/trust.js"></script><script src="../js/cloud.js"></script><script src="../js/api.js"></script><script src="../js/i18n.js"></script><script src="../js/app.js"></script>
<script>
(async () => {
  await API.ready;
  const ctx = UI.shell({ role: 'company', active: 'requests', title: 'Review Details' }); if (!ctx) return;
  const el = ctx.content, id = UI.q('id'), esc = UI.esc;
  let sub, busy = false, tab = 'report', cmpFrom = null, cmpTo = null;
  el.innerHTML = UI.loading();
  const ver = n => sub.versions.find(v => v.no === n);

  function reportTab(v, f, c) {
    const visHtml = sub.image ? `<section class="card"><div class="card-head"><h2>Submitted visual asset</h2><span class="muted small">${sub.visionMeta ? esc(sub.visionMeta.aspectLabel) : 'Image attached'}</span></div><div class="card-body"><div class="row" style="gap:14px;align-items:flex-start;flex-wrap:wrap"><img src="${sub.image}" alt="${esc(sub.altText || 'Submitted visual')}" style="max-width:200px;border-radius:8px;border:1px solid var(--line)"><div class="grow small">${sub.visionMeta ? `<p><b>Contrast:</b> ${sub.visionMeta.contrastRatio}:1 (WCAG min ${sub.visionMeta.minContrast}:1)</p><p style="margin-top:4px"><b>Dominant colors:</b> ${sub.visionMeta.dominantColors.map(dc => `<span style="display:inline-block;width:12px;height:12px;border-radius:3px;background:${dc.hex};border:1px solid #cbd5e1;vertical-align:middle;margin:0 3px"></span><code>${dc.hex}</code>`).join(' ')}</p>` : ''}<p style="margin-top:4px"><b>Alt-text:</b> ${sub.altText ? esc(sub.altText) : '<span class="muted">Not provided</span>'}</p></div></div></div></section>` : '';
    return `${visHtml}<section class="card"><div class="card-head"><h2>Submitted content</h2><span class="muted small">Version ${v.no} · highlighted text has a finding</span></div>
        <div class="card-body"><div class="draft" id="draft">${UI.highlight(v.text, f)}</div></div></section>
      <section class="card card-pad"><div class="row between" style="margin-bottom:10px"><h2>BrandLens checker report</h2><span class="badge b-muted">Rule-based check</span></div>
        ${UI.scoreCard(f)}</section>${UI.scoreDeltaCard(sub.versions)}
      <section><h2 style="margin-bottom:6px">Detected issues</h2>
        <p class="muted small" style="margin-bottom:12px">Decision support only. It checks the post against your own approved rules and facts; it does not approve or reject, and it cannot confirm legal or factual correctness.${c.dismissed ? ' The creator dismissed ' + c.dismissed + ' finding(s); they are shown faded.' : ''}</p>
        ${c.total === 0 ? UI.banner('ok', 'No findings', ' The post matches your approved rules and facts.') : UI.groupedFindings(f, { reviewActions: true })}</section>`;
  }
  function rulesCard(f) {
    const rules = []; const seen = new Set();
    f.forEach(x => { if (!seen.has(x.rule)) { seen.add(x.rule); rules.push(x); } });
    return `<section class="card card-pad"><h2 style="margin-bottom:10px">Relevant company rules</h2>${rules.length ? `<ul class="item-list">${rules.map(x => `<li class="item"><div class="grow small">${esc(x.rule)}</div>${UI.sevBadge(x.severity)}</li>`).join('')}</ul>` : '<p class="muted small">No rules were triggered by this version.</p>'}</section>`;
  }

    function buildChannelPreview(ch, coName, author, text, img, alt, logoUrl) {
      const creatorName = author || 'Content Creator';
      const avatar = `<div class="avatar" style="width:36px;height:36px;font-size:13px">${esc(UI.initials(creatorName))}</div>`;
      const isAd = /ad/i.test(ch), isLi = /linkedin/i.test(ch), isX = /^x /i.test(ch);
      const footer = isAd
        ? `<div style="display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:#F8FAFC;border-top:1px solid var(--line)"><span class="small muted">Sponsored · ${esc(coName)}</span><span class="btn btn-primary btn-sm" style="pointer-events:none;font-size:.78rem">Learn More →</span></div>`
        : isLi
        ? `<div style="display:flex;justify-content:space-around;padding:8px 14px;border-top:1px solid #f1f5f9;color:#64748b;font-size:.8rem;font-weight:600"><span>👍 Like</span><span>💬 Comment</span><span>🔁 Repost</span><span>➤ Send</span></div>`
        : isX
        ? `<div style="display:flex;justify-content:space-between;padding:8px 16px;border-top:1px solid #f1f5f9;color:#64748b;font-size:.8rem"><span>💬 12</span><span>🔁 8</span><span>❤️ 64</span><span>📊 1.2K</span></div>`
        : `<div style="display:flex;justify-content:space-between;padding:9px 14px;border-top:1px solid #f1f5f9;font-size:.85rem;color:#334155"><span>♡ &nbsp; 💬 &nbsp; ➤</span><span>🔖</span></div>`;
      return `<div style="max-width:440px;margin:0 auto;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff;box-shadow:0 4px 18px rgba(15,23,42,.06)">
        <div class="row" style="padding:11px 14px;gap:10px;border-bottom:1px solid #f1f5f9">${avatar}<div class="grow"><div style="display:flex;align-items:center;gap:5px"><b style="font-size:.9rem">${esc(creatorName)}</b><span style="display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:50%;background:#0ea5e9;color:#fff;font-size:10px;font-weight:700">✓</span></div><div class="muted small" style="font-size:.74rem">${esc(ch)} · for <b>${esc(coName)}</b></div></div><span class="muted" style="font-weight:700">···</span></div>
        ${img ? `<div style="background:#0f172a;display:flex;justify-content:center"><img src="${img}" alt="${esc(alt || '')}" style="width:100%;max-height:280px;object-fit:contain;display:block"></div>` : ''}
        <div style="padding:12px 14px;font-size:.9rem;white-space:pre-wrap;line-height:1.5;color:#0f172a">${esc(text || 'Your post copy will appear here…')}</div>
        ${alt ? `<div style="padding:5px 14px 8px;font-size:.74rem;color:#64748b">ALT: ${esc(alt)}</div>` : ''}
        ${footer}
      </div>`;
    }
  function previewTab(v) {
    return `<section class="card card-pad" style="background:#F8FAFC"><h2 style="margin-bottom:12px">Live ${esc(sub.channel)} Mockup</h2>
      ${buildChannelPreview(sub.channel, sub.companyName, sub.creatorName, v.text, sub.image, sub.altText, (ctx.company && ctx.company.knowledge && ctx.company.knowledge.brandLogo) || '')}</section>`;
  }
  function compareTab() {
    const nums = sub.versions.map(v => v.no), subd = (sub.submittedVersions || []).map(x => x.no);
    if (cmpTo == null) { cmpTo = nums[nums.length - 1]; const prev = subd.filter(n => n < cmpTo); cmpFrom = prev.length ? prev[prev.length - 1] : nums[Math.max(0, nums.length - 2)]; }
    const fb = sub.comments.filter(c => c.role === 'company' && c.decision);
    const sel = (idn, cur) => `<select class="select" id="${idn}" style="width:auto">${nums.map(n => `<option value="${n}" ${n === cur ? 'selected' : ''}>Version ${n}${subd.includes(n) ? ' (submitted)' : ''}</option>`).join('')}</select>`;
    const a = ver(cmpFrom).text, b = ver(cmpTo).text;
    return `<section class="card card-pad"><div class="row between" style="margin-bottom:12px"><h2>Original vs revised content</h2>${UI.badge(sub.status)}</div>
        <div class="row" style="margin-bottom:14px"><label class="muted small" for="cf">Original</label>${sel('cf', cmpFrom)}<span class="arrow">→</span><label class="muted small" for="ct">Revised</label>${sel('ct', cmpTo)}
          <span class="pill-row"><ins class="d">added</ins><del class="d">removed</del></span></div>
        ${cmpFrom === cmpTo ? '<p class="muted">Choose two different versions to compare.</p>' : `<div class="diff">${UI.diffHtml(a, b)}</div>`}</section>
      <section class="card card-pad"><h2 style="margin-bottom:10px">Previous company feedback</h2>${fb.length ? fb.map(c => `<div class="comment company"><b>${esc(c.by)}</b><small>${UI.fmtDate(c.at)} · ${UI.statusLabel(c.decision)}</small><p>${esc(c.text)}</p></div>`).join('') : '<p class="muted small">No feedback has been given yet.</p>'}</section>`;
  }

  function render() {
    const v = sub.versions[sub.versions.length - 1], f = (v.findings || []).concat(sub.visionFindings || []), c = BrandCheck.counts(f), pending = sub.status === 'pending_review', cr = sub.creator || {};
    const notice = { approved: sub.autoApproved ? UI.banner('ok', 'Auto-approved by BrandLens', ' This post had no findings and your settings allow auto-approval. It is ready to publish.') : UI.banner('ok', 'You approved this content', ' It is ready to publish.'),
      changes_requested: UI.banner('warn', 'Changes requested', ' Waiting for the creator to revise and resubmit.'), rejected: UI.banner('bad', 'You rejected this content', '') }[sub.status] || '';
    
    const certHtml = sub.status === 'approved' ? `<section class="card card-pad" style="border:1.5px solid #14703A;background:linear-gradient(135deg,#F0FDF4,#FFFFFF);margin-bottom:16px">
      <div class="row between" style="gap:12px;flex-wrap:wrap">
        <div>
          <div style="display:flex;align-items:center;gap:6px;color:#14703A;font-weight:700;font-size:.95rem">${UI.icon('shield', 17)} BrandLens Compliance Verified · Ready to Publish</div>
          <p class="small muted" style="margin-top:4px">Verified ID: <code>BL-${esc(sub.id.toUpperCase())}-V${v.no}</code> · Score: <b>${BrandCheck.score(f).value}/100</b> · Authorized by <b>${esc(sub.companyName)}</b> (${UI.fmtDate(sub.updatedAt)})</p>
        </div>
        <button type="button" class="btn btn-sm" onclick="window.print()">${UI.icon('download', 14)} Print Proof</button>
      </div>
    </section>` : '';
    const canCmp = sub.versions.length > 1;
    if (!canCmp) tab = 'report';
    el.innerHTML = `
      <p style="margin-bottom:10px"><a class="btn btn-ghost btn-sm" href="requests.html">← Review requests</a></p>
      <div class="page-head"><div><h1>#${sub.no} ${esc(sub.title)}</h1><p>${esc(sub.channel)} · version ${v.no} · submitted ${UI.fmtDate(sub.submittedAt)}</p></div>${UI.badge(sub.status)}</div>
      ${notice}
      ${certHtml}
      <div class="grid-2">
        <div class="stack">
          <div class="tabs" style="margin-bottom:0"><button class="tab ${tab === 'report' ? 'on' : ''}" data-tab="report">Content and report</button><button class="tab ${tab === 'preview' ? 'on' : ''}" data-tab="preview">Channel preview</button>${canCmp ? `<button class="tab ${tab === 'compare' ? 'on' : ''}" data-tab="compare">Compare versions (${sub.versions.length})</button>` : ''}</div>
          ${tab === 'report' ? reportTab(v, f, c) : tab === 'preview' ? previewTab(v) : compareTab()}
        </div>
        <div class="stack">
          <section class="card card-pad"><h2 style="margin-bottom:10px">Creator</h2><dl class="kv" style="grid-template-columns:90px 1fr"><dt>Name</dt><dd>${esc(cr.name || sub.creatorName)}</dd><dt>Email</dt><dd>${esc(cr.email || sub.creatorEmail)}</dd>${cr.since ? `<dt>Joined</dt><dd>${UI.fmtDate(cr.since)}</dd>` : ''}<dt>Submissions</dt><dd>${cr.posts != null ? cr.posts + ' to your company' : '–'}</dd></dl></section>
          ${pending ? `<section class="card card-pad"><h2 style="margin-bottom:6px">Your decision</h2><p class="muted small" style="margin-bottom:12px">A comment is required to request changes or reject.</p>
            <div class="field"><label for="dec">Comment to the creator</label><textarea class="textarea" id="dec" style="min-height:90px" placeholder="What should change, or why is it approved?"></textarea><span class="err" id="decErr"></span></div>
            <div class="stack"><button class="btn btn-primary btn-block" data-d="approve">${UI.icon('check-circle', 16)}Approve</button>
            <button class="btn btn-block" data-d="changes">Request changes</button><button class="btn btn-danger btn-block" data-d="reject">Reject</button></div></section>` : ''}
          ${rulesCard(f)}
          <section class="card card-pad"><h2 style="margin-bottom:12px">Comments and feedback</h2>${UI.comments(sub.comments)}
            <div class="field" style="margin:14px 0 0"><textarea class="textarea" id="cm" style="min-height:70px" placeholder="Add a comment"></textarea></div><button class="btn btn-sm" id="cmBtn" style="margin-top:8px">Post comment</button></section>
          <section class="card card-pad"><h2 style="margin-bottom:12px">Submission history</h2>${UI.timeline(sub.events)}</section>
        </div>
      </div>`;
  }

  async function act(fn, ok) { if (busy) return; busy = true; try { sub = await fn(); if (ok) UI.toast(ok, 'ok'); ctx.refreshBell(); render(); } catch (e) { UI.toast(e.message, 'bad'); } busy = false; }

  el.addEventListener('change', e => { if (e.target.id === 'cf') { cmpFrom = +e.target.value; render(); } if (e.target.id === 'ct') { cmpTo = +e.target.value; render(); } });
  el.addEventListener('click', async e => {
    const tb = e.target.closest('[data-tab]'); if (tb) { tab = tb.dataset.tab; return render(); }
    const mk = e.target.closest('mark.hl'); if (mk) return UI.flash('#fc-' + mk.dataset.fid);
    const fa = e.target.closest('[data-act="false_alarm"]');
    if (fa) { const fcEl = fa.closest('.finding'); if (fcEl) return act(() => API.markFalseAlarm(id, fcEl.dataset.fid), 'Marked as false alarm. Ambiguity insights updated.'); }
    const fc = e.target.closest('.finding'); if (fc && !e.target.closest('button')) return UI.flash(`mark[data-fid="${fc.dataset.fid}"]`);
    if (e.target.closest('#cmBtn')) { const t = document.getElementById('cm').value; return act(() => API.addComment(id, t), 'Comment posted.'); }
    const b = e.target.closest('[data-d]'); if (!b) return;
    const d = b.dataset.d, comment = document.getElementById('dec').value.trim(), err = document.getElementById('decErr');
    if (d !== 'approve' && !comment) { err.textContent = 'Add a comment explaining your decision.'; document.getElementById('dec').classList.add('invalid'); return; }
    err.textContent = '';
    const M = { approve: ['Approve this content?', 'It will be marked approved and ready to publish. The creator is notified.', 'Approve', false, 'Content approved.'],
      changes: ['Request changes?', 'The content goes back to the creator with your comment.', 'Request changes', false, 'Changes requested.'],
      reject: ['Reject this content?', 'The creator is notified and cannot resubmit it.', 'Reject', true, 'Content rejected.'] }[d];
    if (await UI.confirmBox({ title: M[0], message: M[1], confirmText: M[2], danger: M[3] })) act(() => API.decide(id, { decision: d, comment }), M[4]);
  });

  try { sub = await API.getSubmission(id); render(); }
  catch (e) { el.innerHTML = UI.empty('alert', 'Could not open this content', 'This submission either does not exist or belongs to another company workspace (BrandLens protects company data isolation).', '<a class="btn" href="requests.html">Back to review requests</a>'); }
})();
</script></body></html>
