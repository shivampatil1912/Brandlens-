<!doctype html>
<html lang="en" data-base="../">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Settings · BrandLens</title>
<link rel="icon" href="../assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css"></head>
<body><div id="app"></div>
<script src="../js/checker.js"></script><script src="../js/api.js"></script><script src="../js/app.js"></script>
<script>
(async () => {
  await API.ready;
  const ctx = UI.shell({ role: 'company', active: 'settings', title: 'Settings' }); if (!ctx) return;
  const el = ctx.content; el.innerHTML = UI.loading();
  try {
    const co = await API.myCompany();
    el.innerHTML = `<div class="page-head"><div><h1>Settings</h1><p>Choose who approves posts for ${UI.esc(co.name)}.</p></div></div>
      <form class="card card-pad" id="f" style="max-width:680px"><h2 style="margin-bottom:12px">Approval mode</h2>
        <label class="check" style="padding:14px;border:1px solid var(--line);border-radius:var(--r-s);margin-bottom:10px"><input type="radio" name="m" value="manual" ${co.autoApprove ? '' : 'checked'}>
          <span><b>Manual approval (recommended)</b><br><span class="muted small">Every post comes to your team. You approve, request changes or reject.</span></span></label>
        <label class="check" style="padding:14px;border:1px solid var(--line);border-radius:var(--r-s);margin-bottom:18px"><input type="radio" name="m" value="auto" ${co.autoApprove ? 'checked' : ''}>
          <span><b>Let BrandLens auto-approve clean posts</b><br><span class="muted small">A post is approved automatically only when the check finds nothing, on its first submission. Anything flagged, and every resubmission after you requested changes, still comes to you. Auto-approvals are marked in your history.</span></span></label>
        <button class="btn btn-primary" type="submit">Save settings</button></form>`;
    document.getElementById('f').onsubmit = async e => {
      e.preventDefault();
      try { await API.setApprovalMode(document.querySelector('input[name=m]:checked').value === 'auto'); UI.toast('Settings saved.', 'ok'); } catch (err) { UI.toast(err.message, 'bad'); }
    };
  } catch (e) { el.innerHTML = UI.empty('alert', 'Could not load settings', e.message, '<button class="btn" onclick="location.reload()">Retry</button>'); }
})();
</script></body></html>
