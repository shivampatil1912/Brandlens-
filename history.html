<!doctype html>
<html lang="en" data-base="../">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Activity History · BrandLens</title>
<link rel="icon" href="../assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css"></head>
<body><div id="app"></div>
<script src="../js/checker.js"></script><script src="../js/api.js"></script><script src="../js/app.js"></script>
<script>
(async () => {
  await API.ready;
  const ctx = UI.shell({ role: 'company', active: 'history', title: 'Activity History' }); if (!ctx) return;
  const el = ctx.content; el.innerHTML = UI.loading();
  try {
    const list = await API.activity();
    el.innerHTML = `<div class="page-head"><div><h1>Activity history</h1><p>Submissions, rule changes, reviews and decisions, newest first.</p></div></div>
      <section class="card card-pad" style="max-width:760px">${list.length ? UI.timeline(list.slice().reverse()) : UI.empty('history', 'No activity yet', 'Changes to your rules and every review decision will be listed here.')}</section>`;
  } catch (e) { el.innerHTML = UI.empty('alert', 'Could not load history', e.message, '<button class="btn" onclick="location.reload()">Retry</button>'); }
})();
</script></body></html>
